[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lcd"
version = "0.0.1"
description = "Logical Coset Distinguishability: numerics for the resource theory of surface-code noise"
requires-python = ">=3.10"
dependencies = ["numpy", "scipy", "pymatching>=2.1", "stim>=1.12"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
