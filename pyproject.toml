[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "lcd"
version = "0.0.1"
description = "Logical Coset Distinguishability: numerics for the resource theory of surface-code noise"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = ["numpy", "scipy", "pymatching>=2.1", "stim>=1.12"]

[project.optional-dependencies]
sinter = ["sinter>=1.12"]
dev = ["pytest", "sinter>=1.12"]

[project.scripts]
lcd-peierls = "lcd.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
