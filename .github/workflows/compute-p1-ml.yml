# Heavy compute on GitHub-hosted runners: extend the ML failure tables of P1 (M2) and redo the analysis.
#
# Trigger by hand (Actions tab -> "Compute: P1 ML tables" -> Run workflow). Every (distance, work point) table is split
# into shards: `runners` machines per table, 4 shards per machine (one per core), each shard adding its share of the
# missing decodes with its own random stream (p1_exchange_rate.py run --shard/--nshards). A shard saves after every
# round, so one stopped by the time cap keeps its progress. The last job adds all shards back onto the stored tables
# (merge_shards.py), runs `analyze`, and pushes to a new branch compute/p1-ml-<run id> (with a pull request if the
# repository allows Actions to open one). Nothing is pushed to main; a cancelled run pushes nothing.
name: "Compute: P1 ML tables"

on:
  workflow_dispatch:
    inputs:
      ds:
        description: "Code distances, space separated (5 7 9 11 13)"
        default: "13"
      points:
        description: "Work points p0:e0, space separated"
        default: "0.06:0.0 0.06:0.02 0.06:0.05 0.04:0.0 0.04:0.02 0.04:0.05"
      scale:
        description: "Decode budget as a multiple of the first pass (existing decodes count towards it)"
        default: "2"
      runners:
        description: "Machines per table (each runs 4 shards, one per core)"
        default: "4"
      minutes:
        description: "Time cap per machine in minutes (GitHub stops a job at 360)"
        default: "330"

permissions:
  contents: write
  pull-requests: write

env:
  OPENBLAS_NUM_THREADS: "1"

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - id: m
        env:
          DS: ${{ inputs.ds }}
          POINTS: ${{ inputs.points }}
          RUNNERS: ${{ inputs.runners }}
        run: |
          python3 - <<'EOF' >> "$GITHUB_OUTPUT"
          import json, os
          ds = [int(x) for x in os.environ["DS"].split()]
          runners = int(os.environ["RUNNERS"])
          inc = []
          for d in ds:
              for s in os.environ["POINTS"].split():
                  p, e = (float(v) for v in s.split(":"))
                  for r in range(runners):
                      inc.append({"d": d, "point": s, "r": r, "table": f"d{d}_p{p:.4f}_e{e:.4f}.npz",
                                  "tag": f"d{d}-p{p:.4f}-e{e:.4f}-r{r}"})
          assert 0 < len(inc) <= 256, f"{len(inc)} jobs (GitHub allows 256 per matrix)"
          print("matrix=" + json.dumps({"include": inc}))
          EOF

  run:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e .
      # Four shards side by side, each in its own copy of the tables. The step's timeout stops it like a cancel; the
      # trap passes the interrupt on, and continue-on-error keeps the job going so the shards are still uploaded.
      - name: Run ${{ matrix.tag }} (4 shards)
        timeout-minutes: ${{ fromJSON(inputs.minutes) }}
        continue-on-error: true
        env:
          D: ${{ matrix.d }}
          POINT: ${{ matrix.point }}
          R: ${{ matrix.r }}
          SCALE: ${{ inputs.scale }}
          RUNNERS: ${{ inputs.runners }}
        run: |
          set +e
          NS=$((RUNNERS * 4))
          pids=()
          for c in 0 1 2 3; do
            out="shard_$c"
            mkdir -p "$out"
            cp -r results/p1_m2/tables "$out/"
            P1_M2_OUT="$out" python experiments/p1_erasure_pauli/p1_exchange_rate.py run --workers 1 --ds "$D" \
              --points "$POINT" --scale "$SCALE" --shard $((R * 4 + c)) --nshards "$NS" > "$out/log.txt" 2>&1 &
            pids+=($!)
          done
          trap 'kill -INT "${pids[@]}" 2>/dev/null; wait' INT TERM
          wait
          for c in 0 1 2 3; do echo "== shard $((R * 4 + c)) of $NS"; tail -n 3 "shard_$c/log.txt"; done
      - name: Keep only this table
        env:
          TABLE: ${{ matrix.table }}
        run: find shard_* -name '*.npz' ! -name "$TABLE" -delete
      - uses: actions/upload-artifact@v4
        with:
          name: table-${{ matrix.tag }}
          path: |
            shard_*/tables/
            shard_*/log.txt
          retention-days: 30

  collect:
    needs: [plan, run]
    # !cancelled(), not always(): a cancelled run must not merge and push (always() runs even after a cancel)
    if: ${{ !cancelled() && needs.plan.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e .
      - uses: actions/download-artifact@v4
        with:
          pattern: table-*
          path: downloaded
      - name: Add the shards onto the stored tables
        id: merge
        run: |
          python experiments/p1_erasure_pauli/merge_shards.py downloaded --tables results/p1_m2/tables
          if git diff --quiet -- results/p1_m2/tables && [ -z "$(git ls-files --others --exclude-standard results/p1_m2/tables)" ]; then
            echo "::warning::no table changed; nothing to analyze or push"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Analyze
        if: steps.merge.outputs.changed == 'true'
        run: python experiments/p1_erasure_pauli/p1_exchange_rate.py analyze --boot 500
      - name: Push to a new branch
        if: steps.merge.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: compute/p1-ml-${{ github.run_id }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git add results/p1_m2/tables results/p1_exchange_rate.json
          git commit -m "P1 ML tables extended by Actions run ${{ github.run_id }} (ds: ${{ inputs.ds }}; scale ${{ inputs.scale }}; ${{ inputs.runners }} machines x 4 shards per table)"
          git push origin "$BRANCH"
          echo "Branch: ${{ github.server_url }}/${{ github.repository }}/tree/$BRANCH" >> "$GITHUB_STEP_SUMMARY"
          gh pr create --base main --head "$BRANCH" --title "P1 ML tables: Actions run ${{ github.run_id }}" \
            --body "Tables extended on GitHub-hosted runners (ds: ${{ inputs.ds }}; points: ${{ inputs.points }}; scale ${{ inputs.scale }}; ${{ inputs.runners }} machines x 4 shards per table). Review results/p1_exchange_rate.json before merging." \
            || echo "::warning::could not open a pull request (allow it under Settings > Actions > General); the branch is pushed"
